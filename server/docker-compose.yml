services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    volumes:
      - .:/workspaces/zelenka_server
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "80:80"
    tty: true
    stdin_open: true

volumes:
  db_data: