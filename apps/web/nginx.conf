server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PWA + SPA: always serve index.html for unknown routes so React Router
    # can take over.
    location / {
        try_files $uri /index.html;
    }

    # Static assets — cached aggressively. Vite injects content hashes into
    # filenames so this is safe.
    location ~* \.(?:js|css|svg|webp|png|jpg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
